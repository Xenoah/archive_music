<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101417">
<meta name="app-base" content="{{base}}">
<title>{{title}}</title>
{{head}}
<link rel="icon" href="{{base}}favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="{{base}}rss.xml">
<link rel="stylesheet" href="{{base}}style.css?v={{build}}">
<script type="application/json" id="boot">{{boot}}</script>
<script type="module" src="{{base}}src/app.js?v={{build}}"></script>
</head>
<body>
<header id="top" class="top"></header>
<main id="app" class="app"><div class="static">{{static}}</div></main>
<div id="bar" class="bar" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
